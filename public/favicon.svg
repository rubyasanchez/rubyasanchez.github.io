<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<rect width="64" height="64" rx="14" fill="#ffffff" />

	<!-- long hair -->
	<rect x="9" y="24" width="11" height="38" rx="5.5" fill="#111111" transform="rotate(-8 14.5 24)" />
	<rect x="44" y="24" width="11" height="38" rx="5.5" fill="#111111" transform="rotate(8 49.5 24)" />

	<!-- hair -->
	<circle cx="32" cy="29" r="20" fill="#111111" />
	<ellipse cx="23" cy="19" rx="3.2" ry="8" fill="#111111" transform="rotate(-18 23 19)" />
	<ellipse cx="41" cy="19" rx="3.2" ry="8" fill="#111111" transform="rotate(18 41 19)" />

	<!-- face -->
	<circle cx="32" cy="36" r="14" fill="#ffffff" stroke="#111111" stroke-width="1.5" />

	<!-- ears -->
	<circle cx="18.5" cy="37" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5" />
	<circle cx="45.5" cy="37" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5" />

	<!-- glasses -->
	<circle cx="25" cy="36" r="6" fill="none" stroke="#111111" stroke-width="2.2" />
	<circle cx="39" cy="36" r="6" fill="none" stroke="#111111" stroke-width="2.2" />
	<path d="M31 36h2" stroke="#111111" stroke-width="2.2" stroke-linecap="round" />
	<path d="M19 34l-3-1.5M45 34l3-1.5" stroke="#111111" stroke-width="2" stroke-linecap="round" />

	<!-- smile -->
	<path d="M28 45c1.3 1.6 2.7 2.3 4 2.3s2.7-.7 4-2.3" stroke="#111111" stroke-width="2" fill="none" stroke-linecap="round" />
</svg>
